name: Bug report
description: Report a reproducible Ultimate De-Slop problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness
      description: Codex, Claude, OpenCode, Cursor, Pi, Command Code, Hermes, or OpenClaw.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the command you ran.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Include only non-sensitive excerpts from `.deslop/runs/`.
      render: text
